<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Management System</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

   {% extends "base.html" %}

{% block title %}Home | Event Management{% endblock %}

{% block content %}

<div class="card">
    <h2>Welcome to Event Management System</h2>
    <p>Create events, manage registrations and track attendees easily.</p>

    <a class="btn" href="{{ url_for('create_event') }}">
        Create Event
    </a>

    <a class="btn" href="{{ url_for('view_events') }}">
        Explore Events
    </a>

    <a class="btn" href="{{ url_for('dashboard') }}">
        View Dashboard
    </a>
</div>

{% endblock %}
</body>
</html>
