<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Event Management System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>Event Management System</h1>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('create_event') }}">Create Event</a>
        <a href="{{ url_for('view_events') }}">All Events</a>
        <a href="{{ url_for('event_categories') }}">Upcoming & Past</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </nav>
</header>

<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</main>

<footer>
    <p>Event Management & RSVP System</p>
</footer>

</body>
</html>
