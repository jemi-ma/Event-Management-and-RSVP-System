<!DOCTYPE html>
<html lang="en">

<head>
    <title>All Events</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>All Events</h1>

    <a href="{{ url_for('create_event') }}">Create New Event</a>

    {% for event in events %}

        <div>

            <a href="{{ url_for('event_details', event_id=event.id) }}">
                View Details
            </a>
            

        </div>

    {% else %}

        <p>No events available.</p>

    {% endfor %}

</body>

</html>
